buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        googlePlayServicesVersion = "21.0.1"
    }
    repositories {
        google()
        mavenCentral()
        
    }
    dependencies {
        // AGP 8.2 predates Gradle 9 and still referenced JvmVendorSpec.IBM_SEMERU,
        // which Gradle 9.0 removed — configuration failed before any code compiled.
        // 8.12.0 is what React Native 0.82.1's own gradle-plugin builds against.
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath('com.google.gms:google-services:4.3.15')
    }
}

apply plugin: "com.facebook.react.rootproject"
